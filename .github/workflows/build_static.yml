name: Build QEMU ARM Static (UCRT64)

on:
  push:
    branches: [master, devel, main]
  workflow_dispatch:

permissions:
  contents: write   # push ci-reports 分支（CI 运行日志存档）

jobs:
  build-windows-ucrt64-arm-static:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: >
          pacman -S --noconfirm base-devel binutils bison curl diffutils
          flex git grep make sed
          ${MINGW_PACKAGE_PREFIX}-toolchain
          ${MINGW_PACKAGE_PREFIX}-glib2
          ${MINGW_PACKAGE_PREFIX}-libiconv
          ${MINGW_PACKAGE_PREFIX}-ninja
          ${MINGW_PACKAGE_PREFIX}-pixman
          ${MINGW_PACKAGE_PREFIX}-pkgconf
          ${MINGW_PACKAGE_PREFIX}-python
          ${MINGW_PACKAGE_PREFIX}-zstd

      - name: Configure
        env:
          LDFLAGS: "-liconv"
        run: >
          ./configure
          --disable-werror
          --disable-docs
          --target-list=arm-softmmu
          --static
          # 注意：不用 --without-default-features——它会关闭部分默认特性，
          # 可能与 s32k348evb 外设（eDMA/eMIOS/LCU 等）的 Kconfig 依赖
          # 冲突，导致 CI 编译版访问 0x40210000/0x40088040/0x40098000
          # 等外设地址报 PRECISERR（本地默认 configure 编译无此问题）。
          --enable-tcg
          --enable-fdt
          --disable-gtk
          --disable-sdl
          --disable-vnc
          --disable-spice
          --disable-curses
          --disable-slirp
          --disable-tools
          --disable-guest-agent
          --disable-capstone
          --disable-libusb
          --disable-bzip2
          --disable-curl
          --audio-drv-list=

      - name: Build
        run: ninja -C build

      - name: Verify static linking (ldd)
        run: |
          echo "=== ldd output ==="
          ldd build/qemu-system-arm.exe || true
          echo ""
          echo "=== Check for MSYS2 DLLs ==="
          if ldd build/qemu-system-arm.exe | grep -iE 'msys64|ucrt64|mingw64|glib|pixman|zstd|intl|iconv'; then
            echo "ERROR: Found MSYS2 dependency DLLs - static link failed!"
            exit 1
          else
            echo "OK: No MSYS2 DLL dependencies found, static link verified."
          fi

      - name: Smoke test
        run: |
          echo "=== QEMU version ==="
          ./build/qemu-system-arm.exe --version
          echo ""
          echo "=== Supported machines (s32) ==="
          ./build/qemu-system-arm.exe -machine help | grep -i s32 || true

      # 全量模型测试：BSP 31 项自检 + bootloader 握手 + FreeRTOS HELLO
      # + info mtree 外设映射（验证用户 abort 三地址 0x40210000/0x40088040/0x40098000）。
      # 固件 ELF 平台无关（ARM 固件），直接复用仓库内预编译 ELF。
      # 脚本跨平台（Windows/Linux）：QMP + socket + subprocess，输出到临时文件防管道阻塞。
      - name: Full model tests (BSP/bootloader/FreeRTOS/mtree)
        shell: bash
        run: |
          python ci/run_tests.py ./build/qemu-system-arm.exe 2>&1 | tee ci-test.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-ucrt64-static
          path: build/qemu-system-arm.exe

      # CI 运行日志存档：无论成败，把 ci-test.log 推到 ci-reports 分支
      - name: Archive CI log to ci-reports branch
        if: always()
        continue-on-error: true   # 存档失败不拖红 job
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-reports
          git checkout -f ci-reports
          mkdir -p ci-reports
          TS=$(date +%Y%m%d-%H%M%S)
          cp ci-test.log "ci-reports/run-${TS}-${{ github.run_id }}.log" 2>/dev/null || true
          git add ci-reports/
          git commit -m "ci report: run ${{ github.run_id }} @ ${TS}" 2>/dev/null || echo "no log change"
          git push origin ci-reports 2>&1 | tail -2 || echo "push failed (token?)"
